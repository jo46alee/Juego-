<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendShopX GameFi</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><header><div><strong>⚡ TrendShopX</strong><span> GAMEFI</span></div><nav><button data-page="game">Planeta</button><button data-page="market">Mercado</button><button data-page="wallet">Wallet</button><button data-page="ranking">Ranking</button><button data-page="missions">Misiones</button><button id="logout">Salir</button></nav></header>
<main><section id="auth" class="auth"><div class="card"><h1>TrendShopX GameFi</h1><p>Construye tu planeta, produce recursos y comercia.</p><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><div class="row"><button id="login">Entrar</button><button class="secondary" id="register">Crear cuenta</button></div><small id="msg"></small></div></section>
<section id="game" class="page"><div class="hero"><div><h1 id="welcome">Tu planeta</h1><p>Producción automática cada hora.</p></div><div id="resources" class="resources"></div></div><div class="grid buildings" id="buildings"></div></section>
<section id="market" class="page hidden"><h2>Mercado P2P</h2><div class="card"><div class="row"><select id="asset"><option>TSX</option><option>USDT</option></select><input id="qty" type="number" placeholder="Cantidad"><input id="price" type="number" placeholder="Precio USDT"><button id="sell">Publicar</button></div><small>Comisión configurable: 3% para el comprador.</small></div><div id="marketList"></div></section>
<section id="wallet" class="page hidden"><h2>Wallet interna</h2><div id="walletBox" class="grid"></div><div class="card"><h3>Movimientos</h3><div id="ledger"></div></div></section>
<section id="ranking" class="page hidden"><h2>Ranking</h2><div class="card" id="rankingList"></div></section>
<section id="missions" class="page hidden"><h2>Misiones</h2><div id="missionList" class="grid"></div></section></main></div><script src="/app.js"></script></body></html>
